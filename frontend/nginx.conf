server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames change on every build, so they are safe to pin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names those hashed files and must never be served stale.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
